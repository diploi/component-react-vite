diploiVersion: v1.0
type: component
name: React + Vite
description: Official Diploi component for React + Vite

supportsAdditionalHosts: { serviceName: 'app' }

hosts:
  - name: App
    identifier: app
    port: 5173

images:
  - identifier: app
    prebuildImage: public.ecr.aws/p8t2q7f4/diploi/component-react-vite:[tag]

# Staging and production build the deployment's commit on its own machine, in the image above, with the deployment's
# environment. Development runs the dev server on the working copy instead
build:
  command: diploi-pm install && NODE_ENV=production diploi-pm run build

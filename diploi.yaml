diploiVersion: v1.0
type: component
name: React + Vite
description: Official Diploi component for React + Vite

supportsAdditionalHosts: { serviceName: 'app' }

hosts:
  - name: App
    identifier: app
    port: 5173

images:
  - identifier: app
    prebuildImage: public.ecr.aws/p8t2q7f4/diploi/component-react-vite:[tag]

# Staging and production build the deployment's commit on its own machine, in the image above, with the deployment's
# environment. Development runs the dev server on the working copy instead
build:
  command: |
    set -e
    if [ -f bun.lock ] || [ -f bun.lockb ]; then PM=bun; bun install --frozen-lockfile || bun install
    elif [ -f pnpm-lock.yaml ]; then PM=pnpm; pnpm install --frozen-lockfile || pnpm install
    elif [ -f yarn.lock ]; then PM=yarn; yarn install --frozen-lockfile || yarn install
    elif [ -f package-lock.json ]; then PM=npm; npm ci || npm install
    else PM=npm; npm install
    fi
    NODE_ENV=production $PM run build

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    matchLabels:
      app: app
  strategy:
  {{- if eq .Values.stage "development"}}
    type: Recreate
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  {{- end }}
  {{- if ne .Values.stage "development" }}
  # The first pod of a new commit builds before it is ready, and the old one serves meanwhile
  progressDeadlineSeconds: 1800
  {{- end }}
  replicas: {{ ternary 1 0 .Values.enabled }}
  template:
    metadata:
      labels:
        app: app
        {{- with .Values.build }}
        diploi.com/build-hash: {{ .hash | quote }}
        diploi.com/commit: {{ $.Values.code.commit | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: diploi-pull-secret
      {{- if eq .Values.stage "development"}}
      initContainers:
        - name: install-dependencies
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          # args, not command: the image's entrypoint runs the project's initScript as root, then this as uid 1000
          args:
          - /bin/sh
          - -c
          - |
            if [ -f bun.lockb ] || [ -f bun.lock ]; then
              bun install --frozen-lockfile || bun install
            elif [ -f yarn.lock ]; then
              yarn install --frozen-lockfile || yarn install
            elif [ -f package-lock.json ]; then
              npm ci || npm install
            elif [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile || pnpm install
            elif [ -f package.json ]; then
              echo "Lockfile not found. Falling back to npm install (non-deterministic install)."
              npm install
            else
              echo "No package manifest found. Skipping install."
            fi
          workingDir: /app{{ .Values.folder }}
          env:
            - name: NODE_ENV
              value: development
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: app-mount
              mountPath: /app
      {{- end }}
      {{- if and (ne .Values.stage "development") .Values.build }}
      # Builds the deployment's commit in its build folder, once: core writes the script (docs.diploi.com, runtime builds)
      initContainers:
        - name: build
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          workingDir: /app{{ .Values.folder }}
          command: ["/bin/sh", "-c", {{ .Values.build.script | quote }}]
          env:
            {{- range (concat .Values.env .Values.build.env) }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            limits:
              memory: {{ .Values.build.memoryMiB }}Mi
          volumeMounts:
            - name: build-folder
              mountPath: /app
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: 500Mi
            limits:
              memory: 1000Mi
          workingDir: /app{{ .Values.folder }}
          # args, not command: the image's entrypoint runs the project's initScript and then the app as uid 1000
          {{- if eq .Values.stage "development" }}
          {{- with .Values.containerCommands.developmentStart }}
          args:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- end }}
          {{- else }}
          {{- with .Values.containerCommands.productionStart }}
          args:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- else }}
          args: ["serve", "-s", "-l", "5173", "dist"]
          {{- end }}
          {{- end }}
          env:
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: ".diploi.me,.{{ .Release.Namespace }}"
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            {{- if hasKey .Values.storage "code" }}
            - name: app-mount
              mountPath: /app
            {{- end }}
            {{- if and (ne .Values.stage "development") .Values.code }}
            - name: build-folder
              mountPath: /app
            {{- end }}
      volumes:
        {{- if hasKey .Values.storage "code" }}
        - name: app-mount
          hostPath:
            path: {{ .Values.storage.code.hostPath }}
        {{- end }}
        {{- if and (ne .Values.stage "development") .Values.code }}
        - name: build-folder
          hostPath:
            path: {{ .Values.code.hostPath }}
        {{- end }}

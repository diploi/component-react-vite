{{- /* The port of the component's own host: the service sends to it, and the app listens on it as PORT */}}
{{- $port := 5173 }}
{{- range .Values.ports }}{{ if eq .identifier "app" }}{{ $port = .port }}{{ end }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    matchLabels:
      app: app
  strategy:
  {{- if eq .Values.stage "development"}}
    type: Recreate
  {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  {{- end }}
  {{- if ne .Values.stage "development" }}
  # The first pod of a new commit builds before it is ready, and the old one serves meanwhile
  progressDeadlineSeconds: 1800
  {{- end }}
  replicas: {{ ternary 1 0 .Values.enabled }}
  template:
    metadata:
      annotations:
        # The image starts as root for initScript and runs the app as 1000, so terminals and diploi exec log in as 1000
        diploi.com/exec-user: "1000:1000"
      labels:
        app: app
        {{- with .Values.build }}
        diploi.com/build-hash: {{ .hash | quote }}
        diploi.com/commit: {{ $.Values.code.commit | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
        - name: diploi-pull-secret
      {{- if eq .Values.stage "development"}}
      initContainers:
        - name: install-dependencies
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          # args, not command: the image's entrypoint runs the project's initScript as root, then this as uid 1000
          args: ["diploi-pm", "install"]
          workingDir: /app{{ .Values.folder }}
          env:
            - name: NODE_ENV
              value: development
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: app-mount
              mountPath: /app
      {{- end }}
      {{- if and (ne .Values.stage "development") .Values.build }}
      # Builds the deployment's commit in its build folder, once: core writes the script (docs.diploi.com, runtime builds)
      initContainers:
        - name: build
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          workingDir: /app{{ .Values.folder }}
          command: ["/bin/sh", "-c", {{ .Values.build.script | quote }}]
          env:
            {{- range (concat .Values.env .Values.build.env) }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            limits:
              memory: {{ .Values.build.memoryMiB }}Mi
          volumeMounts:
            - name: build-folder
              mountPath: /app
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $port }}
          {{- if ne .Values.stage "development" }}
          # Ready once it accepts connections: the rollout and builds waiting for this one go by it
          readinessProbe:
            tcpSocket:
              port: {{ $port }}
            periodSeconds: 5
          {{- end }}
          {{- if ne .Values.stage "development" }}
          # The proxy sends requests here for a moment after this pod starts to stop. Without the wait they fail or hang
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 500Mi
            limits:
              memory: 1000Mi
          workingDir: /app{{ .Values.folder }}
          # args, not command: the image's entrypoint runs the project's initScript and then the app as uid 1000
          {{- if eq .Values.stage "development" }}
          {{- with .Values.containerCommands.developmentStart }}
          args:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- end }}
          {{- else }}
          {{- with .Values.containerCommands.productionStart }}
          args:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- else }}
          args: ["serve", "-s", "-l", "$(PORT)", "dist"]
          {{- end }}
          {{- end }}
          env:
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: ".diploi.me,.{{ .Release.Namespace }}"
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
            # Last, so it wins over a PORT of the project's own
            - name: PORT
              value: {{ $port | quote }}
          volumeMounts:
            {{- if hasKey .Values.storage "code" }}
            - name: app-mount
              mountPath: /app
            {{- end }}
            {{- if and (ne .Values.stage "development") .Values.code }}
            # Read-only, so nothing in the pod can change the build it serves or what root runs at its next start
            - name: build-folder
              mountPath: /app
              readOnly: true
            {{- end }}
      volumes:
        {{- if hasKey .Values.storage "code" }}
        - name: app-mount
          hostPath:
            path: {{ .Values.storage.code.hostPath }}
        {{- end }}
        {{- if and (ne .Values.stage "development") .Values.code }}
        - name: build-folder
          hostPath:
            path: {{ .Values.code.hostPath }}
        {{- end }}
